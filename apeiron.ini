; Apeiron settings. Put this file next to apeiron.exe.
; loop_hz: passes of the game loop per second. The original ran as fast as the Mac could (about 30 on a slow one, 60 or more on a fast one):
;   30  = slow Mac, 60 = a typical fast Mac (default), 120 = very fast
loop_hz = 60
; scale: window size as a multiple of 640x480, 0.5 to 4, hundredths allowed (1.35 = 864x648). The picture always keeps its 4:3 shape.
scale = 1
; fade_ms: length of palette fades in milliseconds
fade_ms = 400
; shots_per_step_only: 1 avoids the original's machine-speed dependent shot handling (shots are then handled once per game step)
shots_per_step_only = 0
; data_dir: folder with the original game files (Apeiron Sprites, Apeiron Titles, ...); a plugin pack can be put in a folder of its own
data_dir = data

; steady_ticks: 0 = the game clock (Ticks) follows the real clock, as on a Mac (default). 1 = Ticks advance by a fixed amount per game pass, so every pass sees the
;   same regular step; the game then runs exactly loop_hz passes per second whatever the timing jitter. Try it if the game seems to stutter or slow down at times.
steady_ticks = 1

; intro: 1 = the start-up screens (the Ambrosia logo, the Apeiron logo with the theme) are shown before the title; 0 skips them.
intro = 1

; mouse_speed: multiplies mouse movement during play (0.1 to 10, hundredths allowed). 1 = the ship follows the pointer one to one at any scale; raise it if a big window needs too much hand movement.
mouse_speed = 1

; hitch_log: 1 writes apeiron_hitches.txt next to where you start the game: every frame that took too long (and which part: the game, the drawing or the wait for the monitor) and, every 5 s, how much game time passed against real time. For finding out what happens when it seems to slow down.
hitch_log = 0

; fix_coin: 1 fixes an original bug: a coin thrown up with a sideways speed of exactly 0 never fell back; it rose to the top of the screen and stayed. 0 = as the original.
fix_coin = 0

; fix_glide: 1 fixes an original bug: when two heads meet head-on at a side wall, the game puts one of them on top of the other (at the wall); they then stay locked together, swapping directions at every row, and slide all the way down the wall and back up (the centipede "glide"). With 1 the head keeps its own place and the two separate. 0 = as the original.
fix_glide = 0

; pede_log: 1 writes apeiron_pede.txt whenever a head comes down five rows within 40 passes without poison (the centipede "glide"): the last 40 passes of that head and its nearest head (position, direction). For finding the cause; it changes nothing in the game.
pede_log = 0
; record: 1 writes every game to apeiron_replay_<date>_<time>.bin (about 10 bytes per step: the mouse, the button and the clock of every step, the seed of every new game). Because the game is deterministic, the file plays the same game again exactly, which is how a bug seen in play can be reproduced and taken apart. F8 in the game puts a mark in the file ("it just happened"; the window title says "marked"). Quit the game normally so the file gets its end mark; a cut-off file still plays up to where it stops.
record = 0
